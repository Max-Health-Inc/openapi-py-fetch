[project]
name = "openapi-py-fetch"
version = "0.2.0"
description = "Lightweight Python OpenAPI 3.x client generator and runtime. Zero Java, zero npm."
authors = [
    {name = "Maximilian Nussbaumer", email = "max.nussbaumer@maxhealth.tech"}
]
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
keywords = ["openapi", "client", "code-generation", "httpx", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
openapi-py-fetch = "openapi_py_fetch.__main__:main"

[project.urls]
Homepage = "https://github.com/Max-Health-Inc/openapi-py-fetch"
Repository = "https://github.com/Max-Health-Inc/openapi-py-fetch"
Issues = "https://github.com/Max-Health-Inc/openapi-py-fetch/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openapi_py_fetch"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15,<0.16",
]

[tool.uv]
required-version = ">=0.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
